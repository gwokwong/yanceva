<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="#FF4500"/>
  <!-- 外圈轨道：市场环境 -->
  <circle cx="16" cy="16" r="10" stroke="white" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- 中圈轨道：推演层 -->
  <circle cx="16" cy="16" r="6" stroke="white" stroke-width="2" fill="none" opacity="0.65"/>
  <!-- 决策核心 -->
  <circle cx="16" cy="16" r="3" fill="white"/>
  <!-- 指示点：推演选中的未来方向（右上 45°） -->
  <circle cx="23" cy="9" r="3" fill="white"/>
